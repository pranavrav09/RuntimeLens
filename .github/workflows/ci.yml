name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Generate, verify CO-RE, build, and test
        run: make ci
